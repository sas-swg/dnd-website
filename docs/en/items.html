    </article>`}).join("")}function openItemModal(id){const i=itemById(id);if(!i)return;const rarity=i.rarityUk||i.rarity||"—",lines=[];i.type==="weapon"&&(lines.push(`<div><b>Damage:</b> ${esc(i.damage||"—")} ${esc(i.damageType||"")}</div>`),lines.push(`<div><b>Properties:</b> ${esc((i.properties||[]).join(", ")||"—")}</div>`),lines.push(`<div><b>Mastery:</b> ${esc(i.mastery||"—")}</div>`)),i.type==="armor"&&lines.push(`<div><b>AC:</b> ${esc(i.ac||"—")}</div>`),activeTab==="mundane"&&(i.cost&&lines.push(`<div><b>Price:</b> ${esc(i.cost)}</div>`),i.weight&&lines.push(`<div><b>Weight:</b> ${esc(i.weight)}</div>`),i.ability&&lines.push(`<div><b>Ability:</b> ${esc(i.ability)}</div>`),i.capacity&&lines.push(`<div><b>Capacity:</b> ${esc(i.capacity)}</div>`),i.poisonType&&lines.push(`<div><b>Poison type:</b> ${esc(i.poisonType)}</div>`),i.roll&&lines.push(`<div><b>Roll:</b> ${esc(i.roll)}</div>`)),activeTab==="magic"&&(lines.push(`<div><b>English:</b> ${esc(i.englishName||i.name)}</div>`),lines.push(`<div><b>Type:</b> ${esc(i.typeEn||i.category)}</div>`),lines.push(`<div><b>Price:</b> ${esc(i.price||"—")}</div>`),lines.push(`<div><b>Attunement:</b> ${i.attunement?"Required":"Not required"}</div>`)),document.getElementById("itemModalBody").innerHTML=`
